<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Flowchart Builder</title> <style> * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } body { margin: 0; display: flex; height: 100vh; background-color: #f4f5f7; } #sidebar { width: 300px; background-color: #ffffff; border-right: 1px solid #dcdfe6; padding: 20px; display: flex; flex-direction: column; gap: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.05); z-index: 10; } h2 { margin-top: 0; color: #303133; font-size: 1.2rem; } .form-group { display: flex; flex-direction: column; gap: 8px; } label { font-size: 0.85rem; color: #606266; font-weight: 600; } input, select, button { padding: 10px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 0.9rem; outline: none; } input:focus, select:focus { border-color: #409eff; } button { cursor: pointer; font-weight: bold; transition: background 0.2s; } .btn-add { background-color: #409eff; color: white; border: none; } .btn-add:hover { background-color: #66b1ff; } .btn-export { background-color: #67c23a; color: white; border: none; margin-top: auto; } .btn-export:hover { background-color: #85ce61; } #canvas-container { flex-grow: 1; position: relative; overflow: auto; background-color: #e5e9f2; background-image: radial-gradient(#d3d7df 1px, transparent 1px); background-size: 20px 20px; } #flowchart-canvas { position: absolute; width: 2000px; height: 2000px; } .node { position: absolute; min-width: 120px; min-height: 60px; padding: 10px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: move; user-select: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: 500; background-color: #ffffff; color: #333333; } .node.start-end { border: 2px solid #f56c6c; border-radius: 20px; } .node.process { border: 2px solid #409eff; border-radius: 4px; } .node.decision { border: 2px solid #e6a23c; transform: rotate(45deg); } .node.decision span { transform: rotate(-45deg); } .node.arrow { min-width: 60px; min-height: 60px; background-color: transparent; box-shadow: none; font-size: 40px; color: #333; } .node.arrow span { transition: transform 0.2s ease; display: inline-block; } .delete-btn { position: absolute; top: -8px; right: -8px; background: #f56c6c; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; display: none; align-items: center; justify-content: center; transform: rotate(0deg); z-index: 5; } .rotate-btn { position: absolute; top: -8px; left: -8px; background: #409eff; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 5; } .resize-handle { position: absolute; bottom: 0; right: 0; width: 15px; height: 15px; cursor: se-resize; z-index: 10; display: none; } .resize-handle::after { content: ''; position: absolute; bottom: 3px; right: 3px; width: 8px; height: 8px; border-right: 2px solid #909399; border-bottom: 2px solid #909399; } .node.decision .delete-btn { transform: rotate(-45deg); top: -15px; right: 15px; } .node:hover .delete-btn, .node:hover .rotate-btn, .node:hover .resize-handle { display: flex; } </style>
</head> <body> <div id="sidebar"> <h2>Flowchart Controls</h2> <div class="form-group"> <label for="node-text">Node Text</label> <input type="text" id="node-text" placeholder="e.g., Start, Process, Yes/No" value="Step"> </div> <div class="form-group"> <label for="node-type">Node Type (Shape)</label> <select id="node-type"> <option value="start-end">Start / End (Oval)</option> <option value="process">Process (Rectangle)</option> <option value="decision">Decision (Diamond)</option> <option value="arrow">Arrow (Connector)</option> </select> </div> <button class="btn-add" id="add-node-btn">Add Node</button> <canvas id="hidden-export-canvas" style="display:none;"></canvas> <button class="btn-export" id="export-btn">Export Transparent PNG</button> </div> <div id="canvas-container"> <div id="flowchart-canvas"></div> </div> <script> const canvas = document.getElementById('flowchart-canvas'); const addNodeBtn = document.getElementById('add-node-btn'); const exportBtn = document.getElementById('export-btn'); const nodeTextInput = document.getElementById('node-text'); const nodeTypeSelect = document.getElementById('node-type'); let activeNode = null; let offsetX = 0; let offsetY = 0; let activeResizeNode = null; let startWidth = 0; let startHeight = 0; let startFontSize = 0; let startX = 0; let startY = 0; canvas.addEventListener('mousedown', (e) => { const targetNode = e.target.closest('.node'); if (targetNode && !e.target.classList.contains('delete-btn') && !e.target.classList.contains('rotate-btn') && !e.target.classList.contains('resize-handle')) { activeNode = targetNode; offsetX = e.clientX - activeNode.offsetLeft; offsetY = e.clientY - activeNode.offsetTop; activeNode.style.zIndex = 1000; } }); document.addEventListener('mousemove', (e) => { if (activeResizeNode) { let dx = e.clientX - startX; let dy = e.clientY - startY; let newWidth = Math.max(30, startWidth + dx); let newHeight = Math.max(30, startHeight + dy); activeResizeNode.style.width = newWidth + 'px'; activeResizeNode.style.height = newHeight + 'px'; if (activeResizeNode.classList.contains('arrow')) { let newFontSize = Math.max(15, startFontSize + (dx + dy) / 2); activeResizeNode.style.fontSize = newFontSize + 'px'; } return; } if (activeNode) { let x = e.clientX - offsetX; let y = e.clientY - offsetY; if (x < 0) x = 0; if (y < 0) y = 0; activeNode.style.left = x + 'px'; activeNode.style.top = y + 'px'; } }); document.addEventListener('mouseup', () => { if (activeResizeNode) { activeResizeNode = null; } if (activeNode) { activeNode.style.zIndex = ''; activeNode = null; } }); addNodeBtn.addEventListener('click', () => { const type = nodeTypeSelect.value; let text = nodeTextInput.value.trim(); if (type === 'arrow' && (!text || text === 'Step')) { text = '➔'; } else if (!text) { text = 'Step'; } const node = document.createElement('div'); node.classList.add('node', type); const container = document.getElementById('canvas-container'); node.style.left = (container.scrollLeft + 150) + 'px'; node.style.top = (container.scrollTop + 150) + 'px'; const textSpan = document.createElement('span'); textSpan.textContent = text; node.appendChild(textSpan); let currentRotation = 0; node.dataset.rotation = currentRotation; if (type === 'arrow') { const rotateBtn = document.createElement('button'); rotateBtn.innerHTML = '↻'; rotateBtn.classList.add('rotate-btn'); rotateBtn.addEventListener('click', () => { currentRotation += 45; textSpan.style.transform = `rotate(${currentRotation}deg)`; node.dataset.rotation = currentRotation; }); node.appendChild(rotateBtn); } const deleteBtn = document.createElement('button'); deleteBtn.innerHTML = '✕'; deleteBtn.classList.add('delete-btn'); deleteBtn.addEventListener('click', () => node.remove()); node.appendChild(deleteBtn); const resizeBtn = document.createElement('div'); resizeBtn.classList.add('resize-handle'); resizeBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); activeResizeNode = node; node.style.minWidth = '20px'; node.style.minHeight = '20px'; startWidth = node.offsetWidth; startHeight = node.offsetHeight; startX = e.clientX; startY = e.clientY; if (node.classList.contains('arrow')) { startFontSize = parseFloat(window.getComputedStyle(node).fontSize); } });
node.appendChild(resizeBtn); canvas.appendChild(node); }); exportBtn.addEventListener('click', () => { const nodes = canvas.querySelectorAll('.node'); if (nodes.length === 0) { alert('Add some nodes to your flowchart before exporting!'); return; } let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity; nodes.forEach(node => { const left = parseFloat(node.style.left); const top = parseFloat(node.style.top); const width = node.offsetWidth; const height = node.offsetHeight; if (left < minX) minX = left; if (top < minY) minY = top; if (left + width > maxX) maxX = left + width; if (top + height > maxY) maxY = top + height; }); const padding = 20; const exportWidth = (maxX - minX) + (padding * 2); const exportHeight = (maxY - minY) + (padding * 2); const expCanvas = document.getElementById('hidden-export-canvas'); const ctx = expCanvas.getContext('2d'); expCanvas.width = exportWidth; expCanvas.height = exportHeight; ctx.clearRect(0, 0, exportWidth, exportHeight); nodes.forEach(node => { const x = parseFloat(node.style.left) - minX + padding; const y = parseFloat(node.style.top) - minY + padding; const w = node.offsetWidth; const h = node.offsetHeight; const text = node.querySelector('span').textContent; ctx.save(); ctx.lineWidth = 2; ctx.fillStyle = '#ffffff'; if (node.classList.contains('start-end')) { ctx.strokeStyle = '#f56c6c'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 20); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#333333'; ctx.font = "500 14px 'Segoe UI'"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + w / 2, y + h / 2); } else if (node.classList.contains('process')) { ctx.strokeStyle = '#409eff'; ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#333333'; ctx.font = "500 14px 'Segoe UI'"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + w / 2, y + h / 2); } else if (node.classList.contains('decision')) { ctx.strokeStyle = '#e6a23c'; ctx.beginPath(); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w, y + h / 2); ctx.lineTo(x + w / 2, y + h); ctx.lineTo(x, y + h / 2); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#333333'; ctx.font = "500 14px 'Segoe UI'"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + w / 2, y + h / 2); } else if (node.classList.contains('arrow')) { const computedStyle = window.getComputedStyle(node); const fontSize = computedStyle.fontSize; ctx.fillStyle = '#333333'; ctx.font = `500 ${fontSize} 'Segoe UI'`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; const rotation = parseFloat(node.dataset.rotation || 0); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rotation * Math.PI / 180); ctx.fillText(text, 0, 0); } ctx.restore(); }); const dataUrl = expCanvas.toDataURL('image/png'); const link = document.createElement('a'); link.download = 'flowchart-transparent.png'; link.href = dataUrl; link.click(); }); </script>
</body></html>
