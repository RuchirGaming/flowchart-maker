<!doctype html> <html lang="en"> <head>
    <meta name="description" content="Create and customize beautiful flowcharts instantly. Design process diagrams, maps, and workflows with our easy-to-use, free online generator.">
    <meta name="keywords" content="flowchart generator, diagram maker, process map, workflow creator, online flowchart tool">
    <meta property="og:title" content="Instant Flowchart Generator">
    <meta property="og:description" content="Design and build custom flowcharts instantly in your browser.">
    <meta property="og:type" content="website">
</head> <title>Flowchart Builder</title> <style> * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } body { margin: 0; display: flex; height: 100vh; background-color: #f4f5f7; } #sidebar { width: 300px; background-color: #ffffff; border-right: 1px solid #dcdfe6; padding: 20px; display: flex; flex-direction: column; gap: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.05); z-index: 10; } h2 { margin-top: 0; color: #303133; font-size: 1.2rem; } .form-group { display: flex; flex-direction: column; gap: 8px; } label { font-size: 0.85rem; color: #606266; font-weight: 600; } input, select, button, textarea { padding: 10px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 0.9rem; outline: none; } input:focus, select:focus, textarea:focus { border-color: #409eff; } button { cursor: pointer; font-weight: bold; transition: background 0.2s; } .btn-add { background-color: #409eff; color: white; border: none; } .btn-add:hover { background-color: #66b1ff; } .btn-export { background-color: #67c23a; color: white; border: none; margin-top: auto; } .btn-export:hover { background-color: #85ce61; } #canvas-container { flex-grow: 1; position: relative; overflow: auto; background-color: #e5e9f2; background-image: radial-gradient(#d3d7df 1px, transparent 1px); background-size: 20px 20px; } #flowchart-canvas { position: absolute; width: 2000px; height: 2000px; } .node { position: absolute; min-width: 120px; min-height: 60px; padding: 10px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: move; user-select: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: 500; background-color: #ffffff; color: #333333; } .node.start-end { border: 2px solid #f56c6c; border-radius: 20px; } .node.process { border: 2px solid #409eff; border-radius: 4px; } .node.decision { background-color: transparent; box-shadow: none; border: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); } .node.arrow { min-width: 60px; min-height: 60px; background-color: transparent; box-shadow: none; font-size: 40px; color: #333; } .node.line { min-width: 80px; min-height: 20px; background-color: transparent; box-shadow: none; border: none; } .line-graphic { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background-color: #333333; transform: translateY(-50%); pointer-events: none; } .node span { display: inline-block; outline: none; padding: 2px 4px; border-radius: 2px; } .node span[contenteditable="true"]:focus { background-color: rgba(64, 158, 255, 0.15); box-shadow: 0 0 0 1px #409eff; cursor: text; } .node.arrow span, .node.line span { transition: transform 0.2s ease; } .delete-btn { position: absolute; top: -8px; right: -8px; background: #f56c6c; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; display: none; align-items: center; justify-content: center; transform: rotate(0deg); z-index: 5; } .rotate-btn { position: absolute; top: -8px; left: -8px; background: #409eff; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 5; } .resize-handle { position: absolute; bottom: 0; right: 0; width: 15px; height: 15px; cursor: se-resize; z-index: 10; display: none; } .resize-handle::after { content: ''; position: absolute; bottom: 3px; right: 3px; width: 8px; height: 8px; border-right: 2px solid #909399; border-bottom: 2px solid #909399; } .node:hover .delete-btn, .node:hover .rotate-btn, .node:hover .resize-handle { display: flex; } </style> </head> <body> <div id="sidebar"> <h2>Made with ❤ by Ruchir!</h2><br> <h2>Flowchart Controls</h2> <div class="form-group"> <label for="node-text">Node Text</label> <input type="text" id="node-text" placeholder="e.g., Start, Process, Yes/No" value="Step"> </div> <div class="form-group"> <label for="node-type">Node Type (Shape)</label> <select id="node-type"> <option value="start-end">Start / End (Oval)</option> <option value="process">Process (Rectangle)</option> <option value="decision">Decision (Diamond)</option> <option value="arrow">Arrow (Connector)</option> <option value="line">Line Segment</option> </select> </div> <button class="btn-add" id="add-node-btn">Add Node</button> <div class="form-group" style="margin-top: 10px;"> <label for="json-input">Import / Export JSON Data</label> <textarea id="json-input" placeholder="Paste flowchart configuration JSON array here..." rows="5" style="font-family: monospace; font-size: 0.75rem; resize: vertical;"></textarea> <div style="display: flex; gap: 8px; margin-top: 4px;"> <button id="import-json-btn" style="flex: 1; padding: 8px; font-size: 0.8rem; background-color: #909399; color: white; border: none; border-radius: 4px;">Import</button> <button id="export-json-btn" style="flex: 1; padding: 8px; font-size: 0.8rem; background-color: #e6a23c; color: white; border: none; border-radius: 4px;">Get JSON</button> </div> </div> <canvas id="hidden-export-canvas" style="display:none;"></canvas> <button class="btn-export" id="export-btn">Export Transparent PNG</button> </div> <div id="canvas-container"> <div id="flowchart-canvas"></div> </div> <script> const canvas = document.getElementById('flowchart-canvas'); const addNodeBtn = document.getElementById('add-node-btn'); const exportBtn = document.getElementById('export-btn'); const nodeTextInput = document.getElementById('node-text'); const nodeTypeSelect = document.getElementById('node-type'); const jsonInput = document.getElementById('json-input'); const importJsonBtn = document.getElementById('import-json-btn'); const exportJsonBtn = document.getElementById('export-json-btn'); let activeNode = null; let offsetX = 0; let offsetY = 0; let activeResizeNode = null; let startWidth = 0; let startHeight = 0; let startFontSize = 0; let startX = 0; let startY = 0;
function saveCanvas() { const nodesData = []; canvas.querySelectorAll('.node').forEach(node => { let type = 'process'; if (node.classList.contains('start-end')) type = 'start-end'; if (node.classList.contains('decision')) type = 'decision'; if (node.classList.contains('arrow')) type = 'arrow'; if (node.classList.contains('line')) type = 'line'; nodesData.push({ type: type, text: node.querySelector('span').textContent, left: node.style.left, top: node.style.top, width: node.style.width, height: node.style.height, fontSize: node.style.fontSize, rotation: node.dataset.rotation || '0' }); }); localStorage.setItem('flowchart_builder_nodes', JSON.stringify(nodesData)); } function createNode(type, text, left, top, width, height, fontSize, rotation) { const node = document.createElement('div'); node.classList.add('node', type); if (left && top) { node.style.left = left; node.style.top = top; } else { const container = document.getElementById('canvas-container'); node.style.left = (container.scrollLeft + 150) + 'px'; node.style.top = (container.scrollTop + 150) + 'px'; } if (width) node.style.width = width; if (height) node.style.height = height; if (fontSize) node.style.fontSize = fontSize; if (type === 'decision') { const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("preserveAspectRatio", "none"); svg.setAttribute("style", "position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0;"); svg.innerHTML = `<polygon points="50,2 98,50 50,98 2,50" fill="#ffffff" stroke="#e6a23c" stroke-width="2" vector-effect="non-scaling-stroke"/>`; node.appendChild(svg); } if (type === 'line') { const lineDiv = document.createElement('div'); lineDiv.classList.add('line-graphic'); node.appendChild(lineDiv); } const textSpan = document.createElement('span'); textSpan.textContent = text; textSpan.style.zIndex = "1"; textSpan.contentEditable = "true"; textSpan.addEventListener('focus', () => { setTimeout(() => { const range = document.createRange(); range.selectNodeContents(textSpan); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); }, 10); }); textSpan.addEventListener('input', () => { saveCanvas(); }); textSpan.addEventListener('blur', () => { window.getSelection().removeAllRanges(); saveCanvas(); }); node.appendChild(textSpan); let currentRotation = parseFloat(rotation || 0); node.dataset.rotation = currentRotation; if ((type === 'arrow' || type === 'line') && currentRotation) { textSpan.style.transform = `rotate(${currentRotation}deg)`; if (type === 'line') { const lineGraphic = node.querySelector('.line-graphic'); if (lineGraphic) lineGraphic.style.transform = `translateY(-50%) rotate(${currentRotation}deg)`; } } if (type === 'arrow' || type === 'line') { const rotateBtn = document.createElement('button'); rotateBtn.innerHTML = '↻'; rotateBtn.classList.add('rotate-btn'); rotateBtn.addEventListener('click', () => { currentRotation += 45; textSpan.style.transform = `rotate(${currentRotation}deg)`; node.dataset.rotation = currentRotation; if (type === 'line') { const lineGraphic = node.querySelector('.line-graphic'); if (lineGraphic) lineGraphic.style.transform = `translateY(-50%) rotate(${currentRotation}deg)`; } saveCanvas(); }); node.appendChild(rotateBtn); } const deleteBtn = document.createElement('button'); deleteBtn.innerHTML = '✕'; deleteBtn.classList.add('delete-btn'); deleteBtn.addEventListener('click', () => { node.remove(); saveCanvas(); }); node.appendChild(deleteBtn); const resizeBtn = document.createElement('div'); resizeBtn.classList.add('resize-handle'); resizeBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); activeResizeNode = node; node.style.minWidth = '30px'; node.style.minHeight = '20px'; startWidth = node.offsetWidth; startHeight = node.offsetHeight; startX = e.clientX; startY = e.clientY; if (node.classList.contains('arrow')) { startFontSize = parseFloat(window.getComputedStyle(node).fontSize); } }); node.appendChild(resizeBtn); canvas.appendChild(node); } function loadCanvas() { const saved = localStorage.getItem('flowchart_builder_nodes'); if (!saved) return; try { const nodesData = JSON.parse(saved); canvas.innerHTML = ''; nodesData.forEach(data => { createNode(data.type, data.text, data.left, data.top, data.width, data.height, data.fontSize, data.rotation); }); } catch (e) { localStorage.removeItem('flowchart_builder_nodes'); } } importJsonBtn.addEventListener('click', () => { const rawValue = jsonInput.value.trim(); if (!rawValue) { alert("Please paste some JSON data first!"); return; } try { const nodesData = JSON.parse(rawValue); if (!Array.isArray(nodesData)) { alert("JSON must be a valid list/array of items!"); return; } canvas.innerHTML = ''; nodesData.forEach(data => { createNode(data.type, data.text || '', data.left, data.top, data.width, data.height, data.fontSize, data.rotation); }); saveCanvas(); } catch (err) { alert("Oops! Invalid JSON syntax. Check the commas and brackets."); } }); exportJsonBtn.addEventListener('click', () => { const nodesData = []; canvas.querySelectorAll('.node').forEach(node => { let type = 'process'; if (node.classList.contains('start-end')) type = 'start-end'; if (node.classList.contains('decision')) type = 'decision'; if (node.classList.contains('arrow')) type = 'arrow'; if (node.classList.contains('line')) type = 'line'; nodesData.push({ type: type, text: node.querySelector('span').textContent, left: node.style.left, top: node.style.top, width: node.style.width, height: node.style.height, fontSize: node.style.fontSize, rotation: node.dataset.rotation || '0' }); }); jsonInput.value = JSON.stringify(nodesData, null, 2); }); canvas.addEventListener('mousedown', (e) => { const targetNode = e.target.closest('.node'); if (targetNode && !e.target.classList.contains('delete-btn') && !e.target.classList.contains('rotate-btn') && !e.target.classList.contains('resize-handle')) { if (e.target.tagName === 'SPAN' && document.activeElement === e.target) { return; } activeNode = targetNode; offsetX = e.clientX - activeNode.offsetLeft; offsetY = e.clientY - activeNode.offsetTop; activeNode.style.zIndex = 1000; if (e.target.tagName === 'SPAN') { e.preventDefault(); e.target.focus(); } } }); document.addEventListener('mousemove', (e) => { if (activeResizeNode) { let dx = e.clientX - startX; let dy = e.clientY - startY; let newWidth = Math.max(30, startWidth + dx); let newHeight = Math.max(20, startHeight + dy); activeResizeNode.style.width = newWidth + 'px'; activeResizeNode.style.height = newHeight + 'px'; if (activeResizeNode.classList.contains('arrow')) { let newFontSize = Math.max(15, startFontSize + (dx + dy) / 2); activeResizeNode.style.fontSize = newFontSize + 'px'; } return; } if (activeNode) { let x = e.clientX - offsetX; let y = e.clientY - offsetY; if (x < 0) x = 0; if (y < 0) y = 0; activeNode.style.left = x + 'px'; activeNode.style.top = y + 'px'; } }); document.addEventListener('mouseup', () => { if (activeResizeNode || activeNode) { saveCanvas(); } if (activeResizeNode) { activeResizeNode = null; } if (activeNode) { activeNode.style.zIndex = ''; activeNode = null; } }); addNodeBtn.addEventListener('click', () => { const type = nodeTypeSelect.value; let text = nodeTextInput.value.trim(); if (type === 'arrow' && (!text || text === 'Step')) { text = '➔'; } else if (type === 'line' && (!text || text === 'Step')) { text = ''; } else if (!text) { text = 'Step'; } createNode(type, text); saveCanvas(); });
exportBtn.addEventListener('click', () => { const nodes = canvas.querySelectorAll('.node'); if (nodes.length === 0) { alert('Add some nodes to your flowchart before exporting!'); return; } let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity; nodes.forEach(node => { const left = parseFloat(node.style.left) || 0; const top = parseFloat(node.style.top) || 0; const width = node.offsetWidth; const height = node.offsetHeight; if (left < minX) minX = left; if (top < minY) minY = top; if (left + width > maxX) maxX = left + width; if (top + height > maxY) maxY = top + height; }); const padding = 40; const exportWidth = (maxX - minX) + (padding * 2); const exportHeight = (maxY - minY) + (padding * 2); const expCanvas = document.getElementById('hidden-export-canvas'); const ctx = expCanvas.getContext('2d'); expCanvas.width = exportWidth; expCanvas.height = exportHeight; ctx.clearRect(0, 0, exportWidth, exportHeight); nodes.forEach(node => { const x = (parseFloat(node.style.left) || 0) - minX + padding; const y = (parseFloat(node.style.top) || 0) - minY + padding; const w = node.offsetWidth; const h = node.offsetHeight; const text = node.querySelector('span').textContent; const rotation = parseFloat(node.dataset.rotation || 0); ctx.save(); ctx.lineWidth = 2; ctx.fillStyle = '#ffffff'; if (node.classList.contains('start-end')) { ctx.strokeStyle = '#f56c6c'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 20); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#333333'; ctx.font = "500 14px 'Segoe UI'"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + w / 2, y + h / 2); } else if (node.classList.contains('process')) { ctx.strokeStyle = '#409eff'; ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#333333'; ctx.font = "500 14px 'Segoe UI'"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + w / 2, y + h / 2); } else if (node.classList.contains('decision')) { ctx.strokeStyle = '#e6a23c'; ctx.beginPath(); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w, y + h / 2); ctx.lineTo(x + w / 2, y + h); ctx.lineTo(x, y + h / 2); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#333333'; ctx.font = "500 14px 'Segoe UI'"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + w / 2, y + h / 2); } else if (node.classList.contains('arrow')) { const computedStyle = window.getComputedStyle(node); const fontSize = computedStyle.fontSize; ctx.fillStyle = '#333333'; ctx.font = `500 ${fontSize} 'Segoe UI'`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rotation * Math.PI / 180); ctx.fillText(text, 0, 0); } else if (node.classList.contains('line')) { ctx.strokeStyle = '#333333'; ctx.lineWidth = 2; ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rotation * Math.PI / 180); ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0); ctx.stroke(); if (text) { ctx.fillStyle = '#333333'; ctx.font = "500 14px 'Segoe UI'"; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(text, 0, -4); } } ctx.restore(); }); const dataUrl = expCanvas.toDataURL('image/png'); const link = document.createElement('a'); link.download = 'flowchart-transparent.png'; link.href = dataUrl; link.click(); }); window.addEventListener('DOMContentLoaded', loadCanvas); </script> </body> </html>
