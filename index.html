<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowchart Builder</title><style>*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}body{margin:0;display:flex;height:100vh;background-color:#f4f5f7}#sidebar{width:300px;background-color:#fff;border-right:1px solid #dcdfe6;padding:20px;display:flex;flex-direction:column;gap:20px;box-shadow:2px 0 5px rgba(0,0,0,.05);z-index:10}h2{margin-top:0;color:#303133;font-size:1.2rem}.form-group{display:flex;flex-direction:column;gap:8px}label{font-size:.85rem;color:#606266;font-weight:600}button,input,select{padding:10px;border:1px solid #dcdfe6;border-radius:4px;font-size:.9rem;outline:0}input:focus,select:focus{border-color:#409eff}button{cursor:pointer;font-weight:700;transition:background .2s}.btn-add{background-color:#409eff;color:#fff;border:none}.btn-add:hover{background-color:#66b1ff}.btn-export{background-color:#67c23a;color:#fff;border:none;margin-top:auto}.btn-export:hover{background-color:#85ce61}#canvas-container{flex-grow:1;position:relative;overflow:auto;background-color:#e5e9f2;background-image:radial-gradient(#d3d7df 1px,transparent 1px);background-size:20px 20px}#flowchart-canvas{position:absolute;width:2000px;height:2000px}.node{position:absolute;min-width:120px;min-height:60px;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:move;user-select:none;box-shadow:0 4px 6px rgba(0,0,0,.1);font-weight:500;background-color:#fff;color:#333}.node.start-end{border:2px solid #f56c6c;border-radius:20px}.node.process{border:2px solid #409eff;border-radius:4px}.node.decision{border:2px solid #e6a23c;transform:rotate(45deg)}.node.decision span{transform:rotate(-45deg)}.node.arrow{min-width:60px;min-height:60px;background-color:transparent;box-shadow:none;font-size:40px;color:#333}.node.arrow span{transition:transform .2s ease;display:inline-block}.delete-btn{position:absolute;top:-8px;right:-8px;background:#f56c6c;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center;transform:rotate(0edg);z-index:5}.rotate-btn{position:absolute;top:-8px;left:-8px;background:#409eff;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5}.resize-handle{position:absolute;bottom:0;right:0;width:15px;height:15px;cursor:se-resize;z-index:10;display:none}.resize-handle::after{content:'';position:absolute;bottom:3px;right:3px;width:8px;height:8px;border-right:2px solid #909399;border-bottom:2px solid #909399}.node.decision .delete-btn{transform:rotate(-45deg);top:-15px;right:15px}.node:hover .delete-btn,.node:hover .resize-handle,.node:hover .rotate-btn{display:flex}</style></head><body><div id="sidebar"><h2>Flowchart Controls</h2><div class="form-group"><label for="node-text">Node Text</label><input id="node-text" placeholder="e.g., Start, Process, Yes/No" value="Step"></div><div class="form-group"><label for="node-type">Node Type (Shape)</label><select id="node-type"><option value="start-end">Start / End (Oval)</option><option value="process">Process (Rectangle)</option><option value="decision">Decision (Diamond)</option><option value="arrow">Arrow (Connector)</option></select></div><button class="btn-add" id="add-node-btn">Add Node</button><canvas id="hidden-export-canvas" style="display:none"></canvas><button class="btn-export" id="export-btn">Export Transparent PNG</button></div><div id="canvas-container"><div id="flowchart-canvas"></div></div><script>const canvas=document.getElementById("flowchart-canvas"),addNodeBtn=document.getElementById("add-node-btn"),exportBtn=document.getElementById("export-btn"),nodeTextInput=document.getElementById("node-text"),nodeTypeSelect=document.getElementById("node-type");let activeNode=null,offsetX=0,offsetY=0,activeResizeNode=null,startWidth=0,startHeight=0,startFontSize=0,startX=0,startY=0;canvas.addEventListener("mousedown",e=>{const t=e.target.closest(".node");t&&!e.target.classList.contains("delete-btn")&&!e.target.classList.contains("rotate-btn")&&!e.target.classList.contains("resize-handle")&&(activeNode=t,offsetX=e.clientX-activeNode.offsetLeft,offsetY=e.clientY-activeNode.offsetTop,activeNode.style.zIndex=1000)}),document.addEventListener("mousemove",e=>{if(activeResizeNode){let t=e.clientX-startX,a=e.clientY-startY,n=Math.max(30,startWidth+t),o=Math.max(30,startHeight+a);if(activeResizeNode.style.width=n+"px",activeResizeNode.style.height=o+"px",activeResizeNode.classList.contains("arrow")){let d=Math.max(15,startFontSize+(t+a)/2);activeResizeNode.style.fontSize=d+"px"}return}if(activeNode){let i=e.clientX-offsetX,l=e.clientY-offsetY;i<0&&(i=0),l<0&&(l=0),activeNode.style.left=i+"px",activeNode.style.top=l+"px"}}),document.addEventListener("mouseup",()=>{activeResizeNode=null,activeNode&&(activeNode.style.zIndex="",activeNode=null)}),addNodeBtn.addEventListener("click",()=>{const e=nodeTypeSelect.value;let t=nodeTextInput.value.trim();"arrow"===e&&(!t||"Step"===t)?t="➔":t||(t="Step");const a=document.createElement("div");a.classList.add("node",e);const n=document.getElementById("canvas-container");a.style.left=n.scrollLeft+150+"px",a.style.top=n.scrollTop+150+"px";const o=document.createElement("span");if(o.textContent=t,a.appendChild(o),let d=0;a.dataset.rotation=d,"arrow"===e){const i=document.createElement("button");i.innerHTML="↻",i.classList.add("rotate-btn"),i.addEventListener("click",()=>{d+=45,o.style.transform=`rotate(${d}deg)`,a.dataset.rotation=d}),a.appendChild(i)}const l=document.createElement("button");l.innerHTML="✕",l.classList.add("delete-btn"),l.addEventListener("click",()=>a.remove()),a.appendChild(l);const c=document.createElement("div");c.classList.add("resize-handle"),c.addEventListener("mousedown",e=>{e.stopPropagation(),activeResizeNode=a,a.style.minWidth="20px",a.style.minHeight="20px",startWidth=a.offsetWidth,startHeight=a.offsetHeight,startX=e.clientX,startY=e.clientY,a.classList.contains("arrow")&&(startFontSize=parseFloat(window.getComputedStyle(a).fontSize))}),a.appendChild(c),canvas.appendChild(a)}),exportBtn.addEventListener("click",()=>{const e=canvas.querySelectorAll(".node");if(0===e.length){alert("Add some nodes to your flowchart before exporting!");return}let t=Infinity,a=Infinity,n=-Infinity,o=-Infinity;e.forEach(e=>{const d=parseFloat(e.style.left),i=parseFloat(e.style.top),l=e.offsetWidth,c=e.offsetHeight;d<t&&(t=d),i<a&&(a=i),d+l>n&&(n=d+l),i+c>o&&(o=i+c)});const d=20,i=n-t+2*d,l=o-a+2*d,c=document.getElementById("hidden-export-canvas"),s=c.getContext("2d");c.width=i,c.height=l,s.clearRect(0,0,i,l),e.forEach(e=>{const n=parseFloat(e.style.left)-t+d,o=parseFloat(e.style.top)-a+d,c=e.offsetWidth,r=e.offsetHeight,h=e.querySelector("span").textContent;if(s.save(),s.lineWidth=2,s.fillStyle="#ffffff",e.classList.contains("start-end"))s.strokeStyle="#f56c6c",s.beginPath(),s.roundRect(n,o,c,r,20),s.fill(),s.stroke(),s.fillStyle="#333333",s.font="500 14px 'Segoe UI'",s.textAlign="center",s.textBaseline="middle",s.fillText(h,n+c/2,o+r/2);else if(e.classList.contains("process"))s.strokeStyle="#409eff",s.beginPath(),s.rect(n,o,c,r),s.fill(),s.stroke(),s.fillStyle="#333333",s.font="500 14px 'Segoe UI'",s.textAlign="center",s.textBaseline="middle",s.fillText(h,n+c/2,o+r/2);else if(e.classList.contains("decision"))s.strokeStyle="#e6a23c",s.beginPath(),s.moveTo(n+c/2,o),s.lineTo(n+c,o+r/2),s.lineTo(n+c/2,o+r),s.lineTo(n,o+r/2),s.closePath(),s.fill(),s.stroke(),s.fillStyle="#333333",s.font="500 14px 'Segoe UI'",s.textAlign="center",s.textBaseline="middle",s.fillText(h,n+c/2,o+r/2);else if(e.classList.contains("arrow")){const u=window.getComputedStyle(e).fontSize;s.fillStyle="#333333",s.font=`500 ${u} 'Segoe UI'`,s.textAlign="center",s.textBaseline="middle";const f=parseFloat(e.dataset.rotation||0);s.translate(n+c/2,o+r/2),s.rotate(f*Math.PI/180),s.fillText(h,0,0)}s.restore()});const r=c.toDataURL("image/png"),h=document.createElement("a");h.download="flowchart-transparent.png",h.href=r,h.click()});</script></body></html>
